<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plany Treningowe</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; margin: 0; padding: 16px; }
        h1 { text-align: center; font-size: 22px; margin-bottom: 20px; color: #4CAF50; }
        .grid { display: flex; flex-direction: column; gap: 12px; }
        .card { background: #1e1e1e; border: 1px solid #333; padding: 18px; border-radius: 12px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .card:active { background: #333; }
        .badge { background: #4CAF50; color: #000; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; padding: 12px 16px; background: #1e1e1e; align-items: center; }
        .close-btn { background: #ff4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <h1>🏋️ Moje Plany Treningowe</h1>
    <div class="grid" id="planList"></div>

    <div class="modal" id="pdfModal">
        <div class="modal-header">
            <span id="modalTitle">Podgląd Planu</span>
            <button class="close-btn" onclick="closePdf()">Zamknij ✖</button>
        </div>
        <iframe id="pdfFrame" src=""></iframe>
    </div>

    <script>
        // TUTAJ DODAJESZ SWOJE PLANY:
        const plans = [
            { week: "Tydzień 03.08 - 09.08", url: "https://drive.google.com/file/d/1Ye9huXnvLoI1-JtxrckUzbQTwadmnD2U/preview", current: true }
        ];

        const container = document.getElementById('planList');
        plans.forEach(plan => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<span>📅 ${plan.week}</span> ${plan.current ? '<span class="badge">Aktualny</span>' : ''}`;
            card.onclick = () => openPdf(plan.url, plan.week);
            container.appendChild(card);
        });

        function openPdf(url, title) {
            document.getElementById('pdfFrame').src = url;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('pdfModal').style.display = 'flex';
        }

        function closePdf() {
            document.getElementById('pdfModal').style.display = 'none';
            document.getElementById('pdfFrame').src = '';
        }
    </script>
</body>
</html>
