<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Plany Treningowe (Cloud)</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #f8fafc; 
            color: #1e293b; 
            margin: 0; 
            padding: 16px; 
            -webkit-font-smoothing: antialiased;
        }

        .header-container {
            margin-bottom: 24px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 { 
            font-size: 22px; 
            font-weight: 800; 
            margin: 0; 
            color: #0f172a; 
            letter-spacing: -0.5px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .grid { display: flex; flex-direction: column; gap: 20px; }

        /* FIZYCZNA KARTA Z MIĘKKIM CIENIEM */
        .card { 
            background: #ffffff; 
            border: 1px solid rgba(226, 232, 240, 0.8); 
            padding: 20px; 
            border-radius: 18px; 
            display: flex; 
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.04), 0 8px 10px -6px rgba(15, 23, 42, 0.02);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card.completed {
            border-color: #86efac;
            background: linear-gradient(180deg, #ffffff 0%, #f0fdf4 100%);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-weight: 700;
            cursor: pointer;
            font-size: 17px;
            color: #0f172a;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-title:hover {
            color: #10b981;
        }

        .btn {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 7px 12px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            color: #334155;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn.done {
            background: #10b981;
            color: white;
            border-color: #059669;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .btn.delete {
            background: #fff1f2;
            color: #e11d48;
            border-color: #fecdd3;
        }

        .btn.add-exercise {
            background: #10b981;
            color: white;
            border: none;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25);
        }

        .photos-container {
            display: flex;
            gap: 12px;
            border-top: 1px dashed #e2e8f0;
            padding-top: 12px;
            flex-wrap: wrap;
        }

        .photo-block {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            padding: 6px 10px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            flex-wrap: wrap;
        }

        .photo-preview {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #cbd5e1;
            transition: transform 0.2s ease;
        }

        .photo-preview:hover {
            transform: scale(1.05);
        }

        .days-section {
            border-top: 1px dashed #e2e8f0;
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .days-title {
            font-size: 13px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .days-grid {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .day-btn {
            position: relative;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            color: #475569;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .day-btn:active {
            transform: scale(0.95);
        }

        .day-btn.active {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px #10b981;
        }

        .day-btn.active .status-dot {
            background-color: #4ade80;
            box-shadow: 0 0 8px #4ade80;
        }

        .day-note-container {
            display: none;
            flex-direction: column;
            gap: 12px;
            background: #f8fafc;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            animation: fadeSlideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .add-ex-box {
            display: flex;
            gap: 8px;
            background: #ffffff;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            align-items: center;
        }

        .custom-select-container {
            position: relative;
            flex: 1;
        }

        .custom-select-trigger {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }

        .custom-select-options {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            max-height: 180px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            -webkit-overflow-scrolling: touch;
            animation: fadeSlideDown 0.15s ease-out;
        }

        .custom-select-options.open {
            display: block;
        }

        .custom-option {
            padding: 10px 12px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
        }

        .custom-option:last-child {
            border-bottom: none;
        }

        .custom-option:hover, .custom-option.selected {
            background: #f0fdf4;
            color: #10b981;
            font-weight: 600;
        }

        .exercise-block {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .ex-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 14px;
            color: #0f172a;
        }

        .last-record-badge {
            background: #f0fdf4;
            color: #15803d;
            font-size: 11.5px;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #bbf7d0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }

        .sets-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .set-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #f1f5f9;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
        }

        .set-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            background: #e2e8f0;
            color: #475569;
            border-radius: 50%;
            font-size: 11px;
            font-weight: 700;
            margin-right: 6px;
        }

        .set-data {
            display: flex;
            align-items: baseline;
            gap: 4px;
            color: #0f172a;
        }

        .set-data strong {
            font-size: 14px;
        }

        .set-data span {
            color: #64748b;
            font-size: 11px;
            margin-right: 4px;
        }

        .btn-mini-delete {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 13px;
            padding: 4px;
            border-radius: 6px;
            transition: all 0.15s ease;
        }

        .btn-mini-delete:hover {
            color: #e11d48;
            background: #ffe4e6;
        }

        .add-set-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 4px;
        }

        .set-input {
            width: 65px;
            padding: 6px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            background: #ffffff;
            transition: border-color 0.2s;
        }

        .set-input:focus {
            outline: none;
            border-color: #10b981;
        }

        .notes-input {
            width: 100%;
            height: 50px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px;
            font-family: inherit;
            font-size: 13px;
            box-sizing: border-box;
            resize: vertical;
            background: #ffffff;
            transition: height 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s;
        }

        .notes-input:focus {
            outline: none;
            border-color: #10b981;
        }

        .notes-input.has-content {
            height: 110px;
            border-color: #93c5fd;
            background: #f8fafc;
        }

        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(4px);
            flex-direction: column; 
            z-index: 1000;
        }

        .modal-header { 
            display: flex; 
            justify-content: space-between; 
            padding: 14px 18px; 
            background: #ffffff; 
            color: #0f172a; 
            align-items: center; 
            border-bottom: 1px solid #e2e8f0;
        }

        .close-btn { 
            background: #fee2e2; 
            color: #ef4444; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 8px; 
            font-weight: 700; 
            cursor: pointer; 
        }

        iframe { width: 100%; height: 100%; border: none; background: white; }

        .full-photo {
            max-width: 100%;
            max-height: 80vh;
            margin: auto;
            object-fit: contain;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>🏋️ Moje Treningi 🏋️</h1>
    </div>

    <div class="grid" id="planList"></div>

    <!-- Modale -->
    <div class="modal" id="pdfModal">
        <div class="modal-header">
            <span id="modalTitle" style="font-weight:700;">Podgląd Planu</span>
            <button class="close-btn" onclick="closePdf()">Zamknij ✕</button>
        </div>
        <iframe id="pdfFrame" src=""></iframe>
    </div>

    <div class="modal" id="photoModal">
        <div class="modal-header">
            <span style="font-weight:700;">Podgląd zdjęcia</span>
            <button class="close-btn" onclick="closePhoto()">Zamknij ✕</button>
        </div>
        <img id="fullPhotoImg" class="full-photo" src="" alt="Podgląd zdjęcia">
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">

    <script>
        const FIREBASE_URL = "https://plan-treningowy-efc6d-default-rtdb.firebaseio.com/";

        const plans = [
            { id: "week_2408", week: "Tydzień 24.08 - 30.08", url: "https://drive.google.com/file/d/1WkpCDUu8tP-nbdbeqJHFBVPBq0Cv1RFk/preview" },
            { id: "week_1708", week: "Tydzień 17.08 - 23.08", url: "https://drive.google.com/file/d/1p8z3edTdXQkY-hO_jiSdlxd2xpFOsDjN/preview" },
            { id: "week_1008", week: "Tydzień 10.08 - 16.08", url: "https://drive.google.com/file/d/1hYGXivHinwIpCMWCDC0pESePvVgAahC0/preview" },
            { id: "week_0408", week: "Tydzień 04.08 - 09.08", url: "https://drive.google.com/file/d/1bzRxy2ZUphxmYaUB3KT_oKOGphFJ5PB1/preview" }
        ];

        const daysOfWeek = ["Poniedziałek", "Wtorek", "Środa", "Czwartek", "Piątek", "Sobota", "Niedziela"];

        const exerciseOptions = [
            "Wyciskanie sztangi na ławce poziomej",
            "Wyciskanie hantli na skosie dodatnim",
            "Przysiad ze sztangą",
            "Martwy ciąg",
            "RDL (Rumuński martwy ciąg)",
            "Wiosłowanie sztangą",
            "Podciąganie nachwytem",
            "Podciąganie podchwytem",
            "Ściąganie w dół na wyciągu",
            "Suwnica",
            "Suwnica jednonóż",
            "Wypady",
            "Face pull",
            "Wyciskanie żołnierskie (OHP)",
            "Uginanie ramion ze sztangą (Biceps)",
            "Prostowanie ramion na wyciągu (Triceps)",
            "Wznosy bokiem z hantlami (Barki)",
            "Wspięcia na palce (Łydki)",
            "Brzuszki / Allahy"
        ];

        let cloudData = { statuses: {}, photos: {}, weightPhotos: {}, dailyNotes: {}, dailyExercises: {} };
        let currentActivePlanId = null;
        let currentPhotoType = null;
        let activeDayKey = {};
        let selectedExercisePerPlan = {};

        function getLastRecordForExercise(exerciseName, currentPlanId, currentDay) {
            if (!cloudData.dailyExercises) return null;

            for (let p of plans) {
                const planId = p.id;
                if (!cloudData.dailyExercises[planId]) continue;

                const revDays = [...daysOfWeek].reverse();
                for (let day of revDays) {
                    if (planId === currentPlanId && day === currentDay) continue;

                    const dayExList = cloudData.dailyExercises[planId][day];
                    if (!dayExList) continue;

                    for (let ex of dayExList) {
                        if (ex.name === exerciseName && ex.sets && ex.sets.length > 0) {
                            let bestSet = ex.sets.reduce((max, s) => parseFloat(s.weight) > parseFloat(max.weight) ? s : max, ex.sets[0]);
                            return {
                                weight: bestSet.weight,
                                reps: bestSet.reps,
                                weekName: p.week.replace("Tydzień ", ""),
                                day: day
                            };
                        }
                    }
                }
            }
            return null;
        }

        async function loadCloudData() {
            try {
                const response = await fetch(`${FIREBASE_URL}/data.json`);
                const data = await response.json();
                if (data) {
                    cloudData = {
                        statuses: data.statuses || {},
                        photos: data.photos || {},
                        weightPhotos: data.weightPhotos || {},
                        dailyNotes: data.dailyNotes || {},
                        dailyExercises: data.dailyExercises || {}
                    };
                }
                renderPlans();
            } catch (error) {
                console.error("Błąd pobierania z bazy:", error);
            }
        }

        async function saveCloudData() {
            try {
                await fetch(`${FIREBASE_URL}/data.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cloudData)
                });
            } catch (error) {
                console.error("Błąd zapisu do bazy:", error);
            }
        }

        function renderPlans() {
            const container = document.getElementById('planList');
            container.innerHTML = '';

            plans.forEach(plan => {
                const isCompleted = cloudData.statuses && cloudData.statuses[plan.id] === true;
                const photoData = cloudData.photos && cloudData.photos[plan.id];
                const weightPhotoData = cloudData.weightPhotos && cloudData.weightPhotos[plan.id];
                const selectedDay = activeDayKey[plan.id];

                const card = document.createElement('div');
                card.className = `card ${isCompleted ? 'completed' : ''}`;
                
                let daysHtml = '';
                daysOfWeek.forEach(day => {
                    const hasNote = cloudData.dailyNotes && cloudData.dailyNotes[plan.id] && cloudData.dailyNotes[plan.id][day];
                    const hasEx = cloudData.dailyExercises && cloudData.dailyExercises[plan.id] && cloudData.dailyExercises[plan.id][day] && cloudData.dailyExercises[plan.id][day].length > 0;
                    
                    const isSelected = selectedDay === day;
                    const hasData = hasNote || hasEx;
                    
                    let btnClass = 'day-btn';
                    if (isSelected) btnClass += ' active';

                    daysHtml += `<button class="${btnClass}" onclick="toggleDay('${plan.id}', '${day}')">
                        ${hasData ? '<span class="status-dot"></span>' : ''}
                        ${day}
                    </button>`;
                });

                const currentDayNote = (selectedDay && cloudData.dailyNotes && cloudData.dailyNotes[plan.id] && cloudData.dailyNotes[plan.id][selectedDay]) || '';
                const currentExercises = (selectedDay && cloudData.dailyExercises && cloudData.dailyExercises[plan.id] && cloudData.dailyExercises[plan.id][selectedDay]) || [];

                let exercisesBlocksHtml = '';
                currentExercises.forEach((ex, exIndex) => {
                    let setsListHtml = '';
                    const sets = ex.sets || [];
                    sets.forEach((set, setIndex) => {
                        setsListHtml += `
                            <div class="set-item">
                                <div class="set-data">
                                    <span class="set-badge">${setIndex + 1}</span>
                                    <strong>${set.weight}</strong><span>kg</span> × <strong>${set.reps}</strong><span>powt.</span>
                                </div>
                                <button class="btn-mini-delete" onclick="removeSet('${plan.id}', '${selectedDay}', ${exIndex}, ${setIndex})" title="Usuń serię">✕</button>
                            </div>
                        `;
                    });

                    const lastRecord = getLastRecordForExercise(ex.name, plan.id, selectedDay);
                    let lastRecordBadgeHtml = '';
                    if (lastRecord) {
                        lastRecordBadgeHtml = `
                            <div class="last-record-badge">
                                🕒 Ostatnio: <strong>${lastRecord.weight} kg × ${lastRecord.reps} powt.</strong> (${lastRecord.day}, ${lastRecord.weekName})
                            </div>
                        `;
                    }

                    exercisesBlocksHtml += `
                        <div class="exercise-block">
                            <div class="ex-header">
                                <span>💪 ${ex.name}</span>
                                <button class="btn delete" style="padding: 4px 8px; font-size: 11px;" onclick="removeExercise('${plan.id}', '${selectedDay}', ${exIndex})">Usuń</button>
                            </div>
                            
                            ${lastRecordBadgeHtml}

                            <div class="sets-list">
                                ${setsListHtml}
                            </div>
                            <div class="add-set-row">
                                <input type="number" id="weight_${plan.id}_${exIndex}" class="set-input" placeholder="${lastRecord ? lastRecord.weight : 'kg'}">
                                <input type="number" id="reps_${plan.id}_${exIndex}" class="set-input" placeholder="${lastRecord ? lastRecord.reps : 'powt.'}">
                                <button class="btn" style="background:#f1f5f9; font-weight:600;" onclick="addSet('${plan.id}', '${selectedDay}', ${exIndex})">➕ Dodaj serię</button>
                            </div>
                        </div>
                    `;
                });

                const currentChoice = selectedExercisePerPlan[plan.id] || exerciseOptions[0];
                let customOptionsHtml = exerciseOptions.map(ex => `
                    <div class="custom-option ${ex === currentChoice ? 'selected' : ''}" onclick="selectCustomOption('${plan.id}', '${ex}')">
                        ${ex}
                    </div>
                `).join('');

                const hasNoteContent = currentDayNote.trim().length > 0;

                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title" onclick="openPdf('${plan.url}', '${plan.week}')">📅 ${plan.week}</span>
                        <button class="btn ${isCompleted ? 'done' : ''}" onclick="toggleStatus('${plan.id}')">
                            ${isCompleted ? 'Zakończony ✅' : 'W trakcie ⏳'}
                        </button>
                    </div>
                    
                    <div class="photos-container">
                        <div class="photo-block">
                            ${photoData ? 
                                `<img src="${photoData}" class="photo-preview" onclick="openPhoto('${photoData}')">
                                 <button class="btn" onclick="triggerFileInput('${plan.id}', 'progress')">🔄 Zmień</button>
                                 <button class="btn delete" onclick="deletePhoto('${plan.id}', 'progress')">🗑️</button>` : 
                                `<button class="btn" onclick="triggerFileInput('${plan.id}', 'progress')">📷 Zdjęcie progresu</button>`
                            }
                        </div>

                        <div class="photo-block">
                            ${weightPhotoData ? 
                                `<img src="${weightPhotoData}" class="photo-preview" onclick="openPhoto('${weightPhotoData}')">
                                 <button class="btn" onclick="triggerFileInput('${plan.id}', 'weight')">🔄 Zmień wagę</button>
                                 <button class="btn delete" onclick="deletePhoto('${plan.id}', 'weight')">🗑️</button>` : 
                                `<button class="btn" onclick="triggerFileInput('${plan.id}', 'weight')">⚖️ Waga</button>`
                            }
                        </div>
                    </div>

                    <div class="days-section">
                        <div class="days-title">Dni treningowe</div>
                        <div class="days-grid">${daysHtml}</div>
                        
                        <div class="day-note-container" id="noteBox_${plan.id}" style="display: ${selectedDay ? 'flex' : 'none'};">
                            <strong style="color:#0f172a; font-size:14px;">🏋️ Trening: ${selectedDay}</strong>
                            
                            <div class="add-ex-box">
                                <div class="custom-select-container">
                                    <div class="custom-select-trigger" onclick="toggleCustomDropdown('${plan.id}')">
                                        <span id="triggerText_${plan.id}">${currentChoice}</span>
                                        <span>▾</span>
                                    </div>
                                    <div class="custom-select-options" id="optionsBox_${plan.id}">
                                        ${customOptionsHtml}
                                    </div>
                                </div>
                                <button class="btn add-exercise" onclick="addExercise('${plan.id}', '${selectedDay}')">➕ Dodaj</button>
                            </div>

                            <div style="display: flex; flex-direction: column; gap: 10px;">
                                ${exercisesBlocksHtml}
                            </div>

                            <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 4px 0;">

                            <label for="noteInput_${plan.id}" style="font-size:12px; font-weight:700; color:#64748b;">📝 NOTATKA Z DNIA:</label>
                            <textarea id="noteInput_${plan.id}" class="notes-input ${hasNoteContent ? 'has-content' : ''}" oninput="handleNoteInput(this)" placeholder="Wpisz ogólne samopoczucie, ból stawów...">${currentDayNote}</textarea>
                            <button class="btn" style="background:#0f172a; color:white; border:none; padding:8px; border-radius:10px; font-weight:600;" onclick="saveDayNote('${plan.id}', '${selectedDay}')">💾 Zapisz notatkę</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function handleNoteInput(textarea) {
            if (textarea.value.trim().length > 0) {
                textarea.classList.add('has-content');
            } else {
                textarea.classList.remove('has-content');
            }
        }

        function toggleCustomDropdown(planId) {
            const box = document.getElementById(`optionsBox_${planId}`);
            if (box) {
                box.classList.toggle('open');
            }
        }

        function selectCustomOption(planId, exName) {
            selectedExercisePerPlan[planId] = exName;
            const trigger = document.getElementById(`triggerText_${planId}`);
            if (trigger) trigger.innerText = exName;
            
            const box = document.getElementById(`optionsBox_${planId}`);
            if (box) box.classList.remove('open');
            
            renderPlans();
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.custom-select-container')) {
                document.querySelectorAll('.custom-select-options').forEach(box => box.classList.remove('open'));
            }
        });

        function toggleDay(planId, day) {
            if (activeDayKey[planId] === day) {
                delete activeDayKey[planId];
            } else {
                activeDayKey[planId] = day;
            }
            renderPlans();
        }

        async function addExercise(planId, day) {
            const name = selectedExercisePerPlan[planId] || exerciseOptions[0];

            if (!cloudData.dailyExercises) cloudData.dailyExercises = {};
            if (!cloudData.dailyExercises[planId]) cloudData.dailyExercises[planId] = {};
            if (!cloudData.dailyExercises[planId][day]) cloudData.dailyExercises[planId][day] = [];

            cloudData.dailyExercises[planId][day].push({ name, sets: [] });

            renderPlans();
            await saveCloudData();
        }

        async function addSet(planId, day, exIndex) {
            const weightInput = document.getElementById(`weight_${planId}_${exIndex}`);
            const repsInput = document.getElementById(`reps_${planId}_${exIndex}`);

            const weight = weightInput.value !== "" ? weightInput.value : (weightInput.placeholder !== "kg" ? weightInput.placeholder : 0);
            const reps = repsInput.value !== "" ? repsInput.value : (repsInput.placeholder !== "powt." ? repsInput.placeholder : 0);

            if (!cloudData.dailyExercises[planId][day][exIndex].sets) {
                cloudData.dailyExercises[planId][day][exIndex].sets = [];
            }

            cloudData.dailyExercises[planId][day].push?.({ weight, reps }) || cloudData.dailyExercises[planId][day][exIndex].sets.push({ weight, reps });

            renderPlans();
            await saveCloudData();
        }

        async function removeSet(planId, day, exIndex, setIndex) {
            cloudData.dailyExercises[planId][day][exIndex].sets.splice(setIndex, 1);
            renderPlans();
            await saveCloudData();
        }

        async function removeExercise(planId, day, exIndex) {
            cloudData.dailyExercises[planId][day].splice(exIndex, 1);
            renderPlans();
            await saveCloudData();
        }

        async function saveDayNote(planId, day) {
            const noteText = document.getElementById(`noteInput_${planId}`).value;
            
            if (!cloudData.dailyNotes) cloudData.dailyNotes = {};
            if (!cloudData.dailyNotes[planId]) cloudData.dailyNotes[planId] = {};
            
            cloudData.dailyNotes[planId][day] = noteText;
            
            renderPlans();
            await saveCloudData();
            alert(`Notatka na ${day} została zapisana w chmurze! ☁️`);
        }

        async function toggleStatus(planId) {
            if (!cloudData.statuses) cloudData.statuses = {};
            cloudData.statuses[planId] = !cloudData.statuses[planId];
            renderPlans();
            await saveCloudData();
        }

        function triggerFileInput(planId, type) {
            currentActivePlanId = planId;
            currentPhotoType = type;
            document.getElementById('fileInput').click();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    const resizedImage = canvas.toDataURL('image/jpeg', 0.6);
                    
                    if (currentPhotoType === 'progress') {
                        if (!cloudData.photos) cloudData.photos = {};
                        cloudData.photos[currentActivePlanId] = resizedImage;
                    } else if (currentPhotoType === 'weight') {
                        if (!cloudData.weightPhotos) cloudData.weightPhotos = {};
                        cloudData.weightPhotos[currentActivePlanId] = resizedImage;
                    }
                    
                    renderPlans();
                    await saveCloudData();
                }
            };
            reader.readAsDataURL(file);
        }

        async function deletePhoto(planId, type) {
            if (confirm("Czy na pewno chcesz usunąć to zdjęcie z chmury?")) {
                if (type === 'progress' && cloudData.photos) {
                    delete cloudData.photos[planId];
                } else if (type === 'weight' && cloudData.weightPhotos) {
                    delete cloudData.weightPhotos[planId];
                }
                renderPlans();
                await saveCloudData();
            }
        }

        function openPdf(url, title) {
            document.getElementById('pdfFrame').src = url;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('pdfModal').style.display = 'flex';
        }

        function closePdf() {
            document.getElementById('pdfModal').style.display = 'none';
            document.getElementById('pdfFrame').src = '';
        }

        function openPhoto(photoSrc) {
            document.getElementById('fullPhotoImg').src = photoSrc;
            document.getElementById('photoModal').style.display = 'flex';
        }

        function closePhoto() {
            document.getElementById('photoModal').style.display = 'none';
            document.getElementById('fullPhotoImg').src = '';
        }

        loadCloudData();
    </script>
</body>
</html>
